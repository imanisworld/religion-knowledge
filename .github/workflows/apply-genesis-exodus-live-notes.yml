name: Apply Genesis and Exodus live notes

on:
  push:
    branches:
      - chatgpt/genesis-exodus-live-notes

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/genesis-exodus-live-notes

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Append audited live-notes section
        run: |
          python3 - <<'PY'
          from pathlib import Path
          target = Path('Field_Guide_Conversation_Reference.md')
          payload = Path('tmp/field-guide-24.md').read_text(encoding='utf-8')
          text = target.read_text(encoding='utf-8')
          if '# 24. GENESIS / EXODUS LIVE TEXT CHECKS' in text:
              raise SystemExit('Section 24 already exists; refusing duplicate append')
          text = text.replace('Last updated: 12 August 2026', 'Last updated: 3 September 2026', 1)
          target.write_text(text.rstrip() + '\n' + payload.rstrip() + '\n', encoding='utf-8')
          PY

      - name: Rebuild committed artifacts
        run: |
          npm run build:readers -- --output .
          npm run build:search-index
          npm run generate-records
          npm run build:standalone

      - name: Validate rebuilt corpus
        run: |
          node --test tests/parser.test.mjs
          node scripts/import/validate-corpus.mjs
          npm run validate:reader-sync
          node scripts/import/validate-app-data.mjs
          bash scripts/test-browser.sh

      - name: Remove temporary applicator and commit
        run: |
          git rm .github/workflows/apply-genesis-exodus-live-notes.yml tmp/field-guide-24.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "notes: add Genesis and Exodus live text checks [skip ci]"
          git push origin HEAD:chatgpt/genesis-exodus-live-notes
