name: Sync standalone bundle on app-a11y branch

on:
  push:
    branches:
      - chatgpt/app-a11y-followup

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/app-a11y-followup

      - name: Install dependencies
        run: npm ci

      - name: Build standalone bundle
        run: npm run build:standalone

      - name: Commit generated bundle if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/religion-knowledge-standalone.html
          if git diff --cached --quiet; then
            echo "Standalone bundle already in sync"
            exit 0
          fi
          git commit -m "chore: sync standalone bundle [skip ci]"
          git push origin HEAD:chatgpt/app-a11y-followup
