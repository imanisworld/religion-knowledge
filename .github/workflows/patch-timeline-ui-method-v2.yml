name: Patch timeline UI method safeguards v2

on:
  push:
    branches:
      - chatgpt/timeline-ui-method-fixes

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/timeline-ui-method-fixes
      - name: Apply patch
        run: python3 timeline-app/.patch_method.py
      - name: Validate source and data
        run: |
          node --check timeline-app/app.js
          node docs/timeline/scripts/validate-timeline.mjs
          node timeline-app/build-data.mjs
      - name: Phone smoke
        run: bash timeline-app/test-browser.sh
      - name: Commit audited source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add timeline-app/app.js timeline-app/styles.css
          git commit -m "timeline ui: enforce zoom and filter semantics [skip ci]"
          git push origin HEAD:chatgpt/timeline-ui-method-fixes
