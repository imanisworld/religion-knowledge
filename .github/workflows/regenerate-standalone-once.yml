name: Regenerate standalone once

on:
  push:
    branches:
      - ui/burgundy-accent-20260926

permissions:
  contents: write

jobs:
  regenerate:
    if: contains(github.event.head_commit.message, '[regen-standalone]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/burgundy-accent-20260926
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build:standalone
      - name: Commit generated bundle
        run: |
          if git diff --quiet -- dist/religion-knowledge-standalone.html; then
            echo "Standalone already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/religion-knowledge-standalone.html
          git commit -m "Regenerate standalone bundle"
          git push
