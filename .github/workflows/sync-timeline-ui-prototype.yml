name: Build timeline DOM prototype branch

on:
  push:
    branches:
      - chatgpt/timeline-dom-prototype

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout prototype branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/timeline-dom-prototype

      - name: Apply audited source corrections
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('timeline-app/app.js')
          s = p.read_text(encoding='utf-8')
          old = "return `≈${Math.round(years / 1000) * 1000.toLocaleString?.() || years.toLocaleString()} years ago`;"
          new = "const rounded = Math.round(years / 1000) * 1000;\n      return `≈${rounded.toLocaleString()} years ago`;"
          if old in s:
              s = s.replace(old, new)
          s = s.replace('claim.scholarship_disagreement', 'claim.scholarly_disagreement')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Check prototype JavaScript syntax
        run: |
          node --check timeline-app/app.js
          node --check timeline-app/build-data.mjs

      - name: Generate research data bundle
        run: node timeline-app/build-data.mjs

      - name: Run phone browser smoke
        run: bash timeline-app/test-browser.sh

      - name: Commit corrected source and generated bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add timeline-app/app.js timeline-app/data.js
          if git diff --cached --quiet; then
            echo "Prototype source and data bundle already in sync"
            exit 0
          fi
          git commit -m "chore: sync timeline prototype build [skip ci]"
          git push origin HEAD:chatgpt/timeline-dom-prototype
