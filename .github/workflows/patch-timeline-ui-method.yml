name: Patch timeline UI method safeguards

on:
  push:
    branches:
      - chatgpt/timeline-ui-method-fixes

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/timeline-ui-method-fixes

      - name: Apply method fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('timeline-app/app.js')
          s = p.read_text(encoding='utf-8')

          replacements = [
            (
              r"    if \(year <= -10_000\) \{\n      const years = Math\.abs\(year\);\n      if \(years >= 1_000_000\) return `≈\$\{trimNumber\(years / 1_000_000\)\} million years ago`;\n      const rounded = Math\.round\(years / 1000\) \* 1000;\n      return `≈\$\{rounded\.toLocaleString\(\)\} years ago`;\n    \}",
              """    if (year <= -10_000) {
      // Timeline dates are signed astronomical years (schema: negative = BCE).
      // Keep the display faithful to the stored coordinate instead of silently
      // reinterpreting a BCE year as a years-before-present measurement.
      const magnitude = Math.abs(year);
      if (magnitude >= 1_000_000) return `≈${trimNumber(magnitude / 1_000_000)} million BCE`;
      const rounded = Math.round(magnitude / 1000) * 1000;
      return `≈${rounded.toLocaleString()} BCE`;
    }""",
              'deep-time formatter'
            ),
            (
              r"  function claimLane\(claim\) \{\n    return \(claim\.region \|\| \[\]\)\.find\(\(lane\) => state\.lanes\.has\(lane\)\) \|\| null;\n  \}\n\n  function visibleClaims\(\) \{\n    return claims\.filter\(\(claim\) => \{\n      if \(!state\.layers\.has\(claim\.subject_type\)\) return false;\n      if \(!claimLane\(claim\)\) return false;\n      if \(!overlaps\(claimDate\(claim\)\)\) return false;\n      return matchesQuery\(claim\);\n    \}\);\n  \}",
              """  function claimLane(claim) {
    return (claim.region || []).find((lane) => state.lanes.has(lane)) || null;
  }

  function zoomLevel(value) {
    const match = /^Z([0-7])$/.exec(String(value || ''));
    return match ? Number(match[1]) : null;
  }

  function visibleAtZoom(claim) {
    const min = zoomLevel(claim.zoom_min);
    const max = zoomLevel(claim.zoom_max);
    if (min === null || max === null) return true;
    return state.zoom >= Math.min(min, max) && state.zoom <= Math.max(min, max);
  }

  function laneWindowClaims(lane) {
    return claims.filter((claim) => claimLane(claim) === lane && visibleAtZoom(claim) && overlaps(claimDate(claim)));
  }

  function visibleClaims() {
    return claims.filter((claim) => {
      if (!visibleAtZoom(claim)) return false;
      if (!state.layers.has(claim.subject_type)) return false;
      if (!claimLane(claim)) return false;
      if (!overlaps(claimDate(claim))) return false;
      return matchesQuery(claim);
    });
  }""",
              'zoom visibility'
            ),
            (
              r"      const absence = laneItems\.length \? '' : '<div class=\"lane-absence\">Not represented in the current filtered dataset\. Coverage status is unknown; no historical absence is inferred\.</div>';",
              """      const baseItems = laneWindowClaims(lane);
      const filteredOut = !laneItems.length && baseItems.length > 0;
      const absence = laneItems.length ? '' : filteredOut
        ? '<div class="lane-absence filtered">Items in this lane and time window are hidden by the current search or layer filters. <button class="inline-reset" type="button" data-clear-display-filters>Show hidden items</button></div>'
        : '<div class="lane-absence">Not represented in the current dataset at this zoom and time window. Coverage status is unknown; no historical absence is inferred.</div>';""",
              'timeline empty state'
            ),
            (
              r"      const content = laneItems\.length \? `(<div class=\"list-claims\">.*?</div>)` : '<p class=\"muted\">Not represented in the current filtered dataset\. Coverage status is unknown\.</p>';",
              None,
              'list empty state'
            ),
          ]

          # First three are ordinary regex substitutions.
          for pattern, replacement, label in replacements[:3]:
            s, count = re.subn(pattern, replacement, s, count=1, flags=re.S)
            if count != 1:
              raise SystemExit(f'{label} target not found')

          old_list = """      const content = laneItems.length ? `<div class=\"list-claims\">${laneItems.map((claim) => `<button class=\"list-claim\" type=\"button\" data-claim-id=\"${escapeHtml(claim.id)}\"><strong>${escapeHtml(entityLabel(claim.subject_id))}</strong><span>${escapeHtml(claim.statement)}</span><small>${escapeHtml(formatRange(claimDate(claim)))} · ${escapeHtml(claim.confidence || 'UNKNOWN')} · ${escapeHtml(claim.subject_type || 'Unknown')}</small></button>`).join('')}</div>` : '<p class=\"muted\">Not represented in the current filtered dataset. Coverage status is unknown.</p>';"""
          new_list = """      const baseItems = laneWindowClaims(lane);
      const content = laneItems.length
        ? `<div class=\"list-claims\">${laneItems.map((claim) => `<button class=\"list-claim\" type=\"button\" data-claim-id=\"${escapeHtml(claim.id)}\"><strong>${escapeHtml(entityLabel(claim.subject_id))}</strong><span>${escapeHtml(claim.statement)}</span><small>${escapeHtml(formatRange(claimDate(claim)))} · ${escapeHtml(claim.confidence || 'UNKNOWN')} · ${escapeHtml(claim.subject_type || 'Unknown')}</small></button>`).join('')}</div>`
        : baseItems.length
          ? '<p class=\"muted\">Items are hidden by the current search or layer filters. <button class=\"inline-reset\" type=\"button\" data-clear-display-filters>Show hidden items</button></p>'
          : '<p class=\"muted\">Not represented in the current dataset at this zoom and time window. Coverage status is unknown; no historical absence is inferred.</p>';"""
          if old_list not in s:
            raise SystemExit('list empty state target not found')
          s = s.replace(old_list, new_list, 1)

          old_summary = "    $('visible-summary').textContent = `${items.length} visible claim${items.length === 1 ? '' : 's'} · ${state.lanes.size} lane${state.lanes.size === 1 ? '' : 's'}`;"
          new_summary = "    $('visible-summary').textContent = `${items.length} visible claim${items.length === 1 ? '' : 's'} · ${state.lanes.size} lane${state.lanes.size === 1 ? '' : 's'} · Z${state.zoom}`;"
          if old_summary not in s:
            raise SystemExit('zoom summary target not found')
          s = s.replace(old_summary, new_summary, 1)

          old_click = """  document.addEventListener('click', (event) => {
    const trigger = event.target.closest('[data-claim-id]');
    if (trigger) openInspector(trigger.dataset.claimId, { origin: trigger });
  });"""
          new_click = """  document.addEventListener('click', (event) => {
    const clear = event.target.closest('[data-clear-display-filters]');
    if (clear) {
      state.query = '';
      state.layers = new Set(allLayers);
      render();
      syncUrl('replace');
      say('Search and layer filters cleared.');
      return;
    }
    const trigger = event.target.closest('[data-claim-id]');
    if (trigger) openInspector(trigger.dataset.claimId, { origin: trigger });
  });"""
          if old_click not in s:
            raise SystemExit('display-filter reset target not found')
          s = s.replace(old_click, new_click, 1)
          p.write_text(s, encoding='utf-8')

          css = Path('timeline-app/styles.css')
          c = css.read_text(encoding='utf-8')
          if '.lane-absence.filtered{' not in c:
            c += '''\n.lane-absence.filtered{background:var(--accent-soft);color:var(--text);border-style:solid;gap:.5rem;flex-wrap:wrap}\n.inline-reset{display:inline-flex;align-items:center;justify-content:center;min-height:36px;padding:.3rem .55rem;border:1px solid var(--accent);border-radius:8px;background:var(--panel);color:var(--accent);font-weight:700;font-size:.72rem}\n'''
          css.write_text(c, encoding='utf-8')
          PY

      - name: Check syntax and validate data
        run: |
          node --check timeline-app/app.js
          node docs/timeline/scripts/validate-timeline.mjs
          node timeline-app/build-data.mjs

      - name: Run phone browser smoke
        run: bash timeline-app/test-browser.sh

      - name: Commit method fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add timeline-app/app.js timeline-app/styles.css
          git commit -m "timeline ui: enforce zoom and filter semantics [skip ci]"
          git push origin HEAD:chatgpt/timeline-ui-method-fixes
