name: Materialize normalized records

on:
  push:
    branches:
      - chatgpt/mobile-app-v1

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/mobile-app-v1
          fetch-depth: 0

      - name: Generate validated chunks
        run: npm run generate-records

      - name: Validate generated JavaScript
        run: |
          for file in data/normalized/generated/*.js; do
            node --check "$file"
          done

      - name: Commit generated files only
        run: |
          git add data/normalized/generated/
          staged="$(git diff --cached --name-only)"
          if [ -z "$staged" ]; then
            echo "Generated files already match; nothing to commit."
            exit 0
          fi
          invalid="$(printf '%s\n' "$staged" | grep -v '^data/normalized/generated/' || true)"
          if [ -n "$invalid" ]; then
            echo "Refusing to commit paths outside generated data:"
            printf '%s\n' "$invalid"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: materialize validated normalized records"
          git push origin HEAD:chatgpt/mobile-app-v1
